<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Pro: Listen & Speak</title>
    <style>
        :root { --primary: #2ecc71; --blue: #3498db; --orange: #e67e22; --bg: #f0f3f5; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .unit-selector { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; margin-bottom: 20px; }
        
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .en { font-size: 1.8em; font-weight: bold; color: #2c3e50; display: block; margin-bottom: 5px; }
        .vi { color: #7f8c8d; font-size: 1.1em; display: block; margin-bottom: 20px; }
        
        .control-btns { display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        
        .btn-listen { background: var(--blue); box-shadow: 0 4px 0 #2980b9; }
        .btn-speak { background: var(--orange); box-shadow: 0 4px 0 #d35400; }
        button:active { transform: translateY(3px); box-shadow: none; }

        .result-box { margin-top: 15px; padding: 10px; border-radius: 8px; font-weight: bold; min-height: 20px; }
        .listening { background: #fff3cd; color: #856404; animation: pulse 1.5s infinite; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <select class="unit-selector" id="unitSelect" onchange="renderWords()">
        <option value="">-- Chọn bài học --</option>
        {% for id, content in lessons.items() %}
            <option value="{{id}}">{{content.title}}</option>
        {% endfor %}
    </select>

    <div id="app-container"></div>

    <script>
        const lessons = {{ lessons|tojson }};
        
        // 1. PHẦN NGHE: Sử dụng giọng đọc chuẩn của máy
        function hear(text) {
            window.speechSynthesis.cancel(); // Dừng các giọng đang đọc dở
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'en-US';
            speech.rate = 0.8; // Đọc hơi chậm để bạn nghe rõ
            window.speechSynthesis.speak(speech);
        }

        // 2. PHẦN MIC: Nhận diện giọng nói và so sánh
        function startMic(targetText, resultId) {
            const resultDiv = document.getElementById(resultId);
            const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!Recognition) {
                alert("App này cần quyền Mic hoặc trình duyệt của bạn không hỗ trợ.");
                return;
            }

            const recog = new Recognition();
            recog.lang = 'en-US';
            resultDiv.innerHTML = "🔴 Đang nghe... Hãy nói!";
            resultDiv.className = "result-box listening";

            recog.start();

            recog.onresult = (event) => {
                const speechResult = event.results[0][0].transcript.toLowerCase().trim();
                const cleanTarget = targetText.toLowerCase().replace(/[.,!?;]/g, "").trim();

                if (speechResult.includes(cleanTarget) || cleanTarget.includes(speechResult)) {
                    resultDiv.innerHTML = "✅ Chính xác! Bạn nói: '" + speechResult + "'";
                    resultDiv.className = "result-box success";
                } else {
                    resultDiv.innerHTML = "❌ Sai rồi. Bạn nói: '" + speechResult + "'";
                    resultDiv.className = "result-box fail";
                }
            };

            recog.onerror = () => {
                resultDiv.innerHTML = "⚠️ Lỗi Mic (Chưa cấp quyền hoặc mạng yếu)";
                resultDiv.className = "result-box fail";
            };
        }

        function renderWords() {
            const unitId = document.getElementById('unitSelect').value;
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            if (unitId && lessons[unitId]) {
                lessons[unitId].words.forEach((item, index) => {
                    const resId = 'res-' + index;
                    container.innerHTML += `
                        <div class="card">
                            <span class="en">${item.en}</span>
                            <span class="vi">${item.vi}</span>
                            <div class="control-btns">
                                <button class="btn-listen" onclick="hear('${item.en.replace(/'/g, "\\'")}')">🔊 NGHE</button>
                                <button class="btn-speak" onclick="startMic('${item.en.replace(/'/g, "\\'")}', '${resId}')">🎤 LUYỆN NÓI</button>
                            </div>
                            <div id="${resId}" class="result-box"></div>
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
