<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Pro: Nghe & Nói</title>
    <style>
        :root { --primary: #2ecc71; --secondary: #3498db; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; text-align: center; }
        .header { background: var(--primary); color: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .unit-selector { width: 100%; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .en { font-size: 1.5em; font-weight: bold; display: block; }
        .vi { color: #27ae60; margin-bottom: 10px; display: block; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        .btn-listen { background: var(--secondary); }
        .btn-speak { background: #e67e22; }
        .status { margin-top: 10px; font-size: 0.9em; font-weight: bold; }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
    </style>
</head>
<body>

<div class="header">
    <h2>Học & Luyện Nói</h2>
</div>

<select class="unit-selector" id="unitSelect" onchange="loadLesson()">
    <option value="">-- Chọn bài học --</option>
    {% for id, content in lessons.items() %}
        <option value="{{id}}">{{content.title}}</option>
    {% endfor %}
</select>

<div id="lessonContent"></div>

<script>
    const lessonsData = {{ lessons|tojson }};
    
    // 1. CHỨC NĂNG NGHE (Text-to-Speech)
    function playAudio(text) {
        const msg = new SpeechSynthesisUtterance();
        msg.text = text;
        msg.lang = 'en-US';
        msg.rate = 0.9; // Đọc hơi chậm để dễ nghe
        window.speechSynthesis.speak(msg);
    }

    // 2. CHỨC NĂNG NÓI (Speech-to-Text)
    function startListening(targetText, statusId) {
        const statusDiv = document.getElementById(statusId);
        
        // Kiểm tra trình duyệt có hỗ trợ Mic không
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Trình duyệt của bạn không hỗ trợ Microphone.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        statusDiv.innerHTML = "Đang nghe... Hãy nói đi!";
        statusDiv.style.color = "blue";

        recognition.start();

        recognition.onresult = function(event) {
            const result = event.results[0][0].transcript.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");
            const target = targetText.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");
            
            if (result === target) {
                statusDiv.innerHTML = "Chính xác! Bạn nói: " + result;
                statusDiv.className = "status correct";
            } else {
                statusDiv.innerHTML = "Chưa đúng. Bạn nói: " + result + " (Cần nói: " + target + ")";
                statusDiv.className = "status wrong";
            }
        };

        recognition.onerror = function() {
            statusDiv.innerHTML = "Lỗi Mic hoặc bạn chưa nói gì.";
            statusDiv.className = "status wrong";
        };
    }

    function loadLesson() {
        const selectedId = document.getElementById('unitSelect').value;
        const container = document.getElementById('lessonContent');
        container.innerHTML = '';
        
        if(selectedId && lessonsData[selectedId]) {
            lessonsData[selectedId].words.forEach((item, index) => {
                const id = 'status-' + index;
                container.innerHTML += `
                    <div class="card">
                        <span class="en">${item.en}</span>
                        <span class="vi">${item.vi}</span>
                        <div class="btn-group">
                            <button class="btn-listen" onclick="playAudio('${item.en}')">🔊 NGHE</button>
                            <button class="btn-speak" onclick="startListening('${item.en}', '${id}')">🎤 LUYỆN NÓI</button>
                        </div>
                        <div id="${id}" class="status"></div>
                    </div>
                `;
            });
        }
    }
</script>
</body>
</html>
