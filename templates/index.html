<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Pro</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-box { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-hear { background: #3498db; }
        .btn-mic { background: #e67e22; }
        #status { font-weight: bold; margin-top: 10px; display: block; min-height: 20px; }
    </style>
</head>
<body>
    <select id="unitSelect" style="width:100%; padding:15px; margin-bottom:20px;" onchange="showWords()">
        <option value="">-- Chọn bài học --</option>
        {% for id, content in lessons.items() %}
            <option value="{{id}}">{{content.title}}</option>
        {% endfor %}
    </select>

    <div id="main"></div>

    <script>
        const data = {{ lessons|tojson }};
        
        function hear(txt) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(txt);
            speech.lang = 'en-US';
            window.speechSynthesis.speak(speech);
        }

        function startMic(target, resId) {
            const out = document.getElementById(resId);
            const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!Rec) { alert("Thiết bị không hỗ trợ Mic"); return; }

            const recognizer = new Rec();
            recognizer.lang = 'en-US';
            out.innerHTML = "🔴 Đang nghe...";
            recognizer.start();

            recognizer.onresult = (e) => {
                const userSaid = e.results[0][0].transcript.toLowerCase();
                if(userSaid.includes(target.toLowerCase())) {
                    out.innerHTML = "✅ Đúng: " + userSaid;
                    out.style.color = "green";
                } else {
                    out.innerHTML = "❌ Sai: " + userSaid;
                    out.style.color = "red";
                }
            };
        }

        function showWords() {
            const id = document.getElementById('unitSelect').value;
            const box = document.getElementById('main');
            box.innerHTML = '';
            if(data[id]) {
                data[id].words.forEach((w, i) => {
                    box.innerHTML += `
                        <div class="card">
                            <h2>${w.en}</h2>
                            <p>${w.vi}</p>
                            <div class="btn-box">
                                <button class="btn-hear" onclick="hear('${w.en}')">🔊 NGHE</button>
                                <button class="btn-mic" onclick="startMic('${w.en}', 'res${i}')">🎤 NÓI</button>
                            </div>
                            <div id="res${i}" style="margin-top:10px; font-weight:bold;"></div>
                        </div>`;
                });
            }
        }
    </script>
</body>
</html>
