<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Vocabulary Pro</title>
    <style>
        /* --- GIAO DIỆN CSS CHUYÊN NGHIỆP CHO MOBILE --- */
        :root {
            --primary-color: #2ecc71;
            --bg-color: #f8f9fa;
            --text-dark: #2c3e50;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-dark);
        }

        .header {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }

        .unit-selector {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--primary-color);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 25px;
            background: white;
            outline: none;
        }

        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 6px solid var(--primary-color);
            transition: transform 0.2s;
        }

        .word-en {
            font-size: 1.5em;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .word-ipa {
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .word-vi {
            color: #27ae60;
            font-size: 1.2em;
            font-weight: 500;
        }

        .audio-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .audio-btn:active {
            transform: scale(0.95);
            background-color: #27ae60;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8em;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0; font-size: 1.4em;">ENGLISH IN USE</h1>
        <p style="margin:5px 0 0; opacity: 0.9; font-size: 0.9em;">Elementary Vocabulary</p>
    </div>

    <select class="unit-selector" id="unitSelect" onchange="loadLesson()">
        <option value="">-- Chọn bài học từ PDF --</option>
        {% for id, content in lessons.items() %}
            <option value="{{id}}">{{content.title}}</option>
        {% endfor %}
    </select>

    <div id="lessonContent"></div>

    <div class="footer">
        © 2026 Mobile Learning App
    </div>

    <script>
        // Lấy dữ liệu từ Flask gửi sang dạng JSON
        const lessonsData = {{ lessons|tojson }};
        
        function loadLesson() {
            const selectedId = document.getElementById('unitSelect').value;
            const container = document.getElementById('lessonContent');
            container.innerHTML = ''; // Xóa bài cũ
            
            if(selectedId && lessonsData[selectedId]) {
                const words = lessonsData[selectedId].words;
                
                words.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="word-en">${item.en}</div>
                        <div class="word-ipa">${item.ipa}</div>
                        <div class="word-vi">${item.vi}</div>
                        <button class="audio-btn" onclick="speak('${item.en.replace(/'/g, "\\'")}')">
                            <span>🔊 PHÁT ÂM</span>
                        </button>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // Hàm phát âm sử dụng Google TTS trực tiếp trên trình duyệt (Rất nhẹ)
        function speak(text) {
            const url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=" + encodeURIComponent(text);
            const audio = new Audio(url);
            audio.play().catch(e => console.log("Lỗi phát âm:", e));
        }
    </script>
</body>
</html>
